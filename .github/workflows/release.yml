name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.verify.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: false
          run-install: |
            - args: ['--frozen-lockfile']

      - id: verify
        name: Verify release tag
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          version="$(node -p "require('./package.json').version")"
          release_commit="$(git rev-parse "${tag}^{commit}")"

          if [[ "${tag}" != "v${version}" ]]; then
            echo "::error::Tag ${tag} does not match package version ${version}."
            exit 1
          fi

          if ! git merge-base --is-ancestor "${release_commit}" origin/main; then
            echo "::error::Tag ${tag} must point to a commit reachable from origin/main."
            exit 1
          fi

          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"

      - name: Check
        run: vp run check

      - name: Pack package
        run: |
          mkdir package
          npm pack --ignore-scripts --pack-destination package

      - name: Build image
        env:
          VERSION: ${{ steps.verify.outputs.version }}
        run: |
          title="$(node -p "require('./package.json').name")"
          description="$(node -p "require('./package.json').description")"
          license="$(node -p "require('./package.json').license")"

          buildah build \
            --platform linux/amd64 \
            --label "org.opencontainers.image.title=$title" \
            --label "org.opencontainers.image.description=$description" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.licenses=$license" \
            -t localhost/agent-driver \
            .
          buildah push localhost/agent-driver oci-archive:image.oci.tar

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: package/*.tgz
          if-no-files-found: error
          retention-days: 1

      - name: Upload image
        uses: actions/upload-artifact@v7
        with:
          name: container-image
          path: image.oci.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish-image:
    name: Publish image
    needs: build
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
    permissions:
      packages: write
    steps:
      - name: Download image
        uses: actions/download-artifact@v8
        with:
          name: container-image

      - name: Publish image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | skopeo login --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          skopeo copy oci-archive:image.oci.tar "docker://$IMAGE:$VERSION"
          skopeo copy oci-archive:image.oci.tar "docker://$IMAGE:latest"

  publish-npm:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@mosoo/agent-driver/v/${{ needs.build.outputs.version }}
    permissions:
      id-token: write
    steps:
      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: package

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          registry-url: https://registry.npmjs.org

      - name: Publish package
        run: npm publish package/*.tgz --ignore-scripts
        # Bootstrap only: remove this env block after configuring npm Trusted Publishing.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
