name: Pull Request Checks

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - edited
      - synchronize

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-pr-title:
    name: Validate PR title
    runs-on: depot-ubuntu-24.04
    permissions:
      pull-requests: read
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert

  check:
    name: Check
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']

      - name: Lint
        run: vp run lint

      - name: Typecheck
        run: vp run tc

      - name: Test
        run: vp run test

      - name: Build
        run: vp run build

      - name: Verify driver artifact
        run: test -f dist/driver.mjs

  docker:
    name: Docker
    needs: check
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']

      - name: Build driver artifact
        run: vp run build

      - name: Build Docker image
        run: docker build --platform linux/amd64 -t agent-driver:ci .

      - name: Verify packaged binaries
        run: |
          docker run --rm --entrypoint /bin/sh agent-driver:ci -c '
            test -x /usr/local/bin/agent-driver
            test -x /usr/local/bin/mosoo-claude-code
            codex --version
            codex app-server --help >/dev/null
            opencode --version
            opencode acp --help >/dev/null
            test "$MOSOO_ACP_FALLBACK_COMMAND" = opencode
          '
