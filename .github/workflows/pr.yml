name: Pull Request Checks

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - edited
      - synchronize

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-pr-title:
    name: Validate PR title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert

  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']

      - name: Check
        run: |
          set -euo pipefail
          vp run lint
          vp run tc
          vp run test
          vp run build
          test -f dist/driver.mjs
          test -s dist/driver.mjs
          test -x dist/driver.mjs
          test "$(head -n 1 dist/driver.mjs)" = '#!/usr/bin/env bun'

  image:
    name: Container image
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']

      - name: Build driver artifact
        run: vp run build

      - name: Build container image
        run: buildah build --platform linux/amd64 -t agent-driver:ci .

      - name: Verify packaged binaries
        run: |
          buildah from --name agent-driver-ci-container agent-driver:ci
          buildah run agent-driver-ci-container -- /bin/sh -c '
            test -x /usr/local/bin/agent-driver
            test -x /usr/local/bin/mosoo-claude-code
            codex --version
            codex app-server --help >/dev/null
            opencode --version
            opencode acp --help >/dev/null
            test "$MOSOO_ACP_FALLBACK_COMMAND" = opencode
          '
